mission.survive-the-market-crash.objective.stop=Prot\u00e9gez au moins une position avec un stop
mission.survive-the-market-crash.objective.react=Prenez une d\u00e9cision dans les deux jours suivant le krach
mission.survive-the-market-crash.event.warning.headline=Les minutes de la banque centrale signalent des valorisations tendues
mission.survive-the-market-crash.event.warning.body=Les d\u00e9cideurs soulignent la croissance rapide du cr\u00e9dit et des valorisations actions \u00e9lev\u00e9es, surtout en technologie.
mission.survive-the-market-crash.event.crash.headline=Krach : les actions plongent apr\u00e8s l'effondrement d'un grand fonds
mission.survive-the-market-crash.event.crash.body=Des ventes forc\u00e9es se propagent \u00e0 tous les secteurs. La techno et les banques sont les plus touch\u00e9es ; les investisseurs fuient vers les obligations.
mission.survive-the-market-crash.event.aftershock.headline=R\u00e9plique : des appels de marge forcent une nouvelle vague de ventes
mission.survive-the-market-crash.event.aftershock.body=Les investisseurs \u00e0 effet de levier vendent ce qu'ils peuvent, pas ce qu'ils veulent.
mission.survive-the-market-crash.event.stabilisation.headline=La banque centrale annonce un soutien de liquidit\u00e9
mission.survive-the-market-crash.event.stabilisation.body=Le pr\u00eat d'urgence calme les march\u00e9s de financement. La volatilit\u00e9 commence \u00e0 s'att\u00e9nuer.
stress.equity-crash.name=Krach actions
stress.equity-crash.description=Toutes les actions baissent de 20 % ; le fonds obligataire gagne 2 %.
stress.tech-selloff.name=Vente massive techno
stress.tech-selloff.description=TunisTech baisse de 30 % ; les autres actions de 5 %.
stress.rate-hike.name=Hausse des taux
stress.rate-hike.description=Obligations \u22124 %, services aux collectivit\u00e9s \u22126 %, banques +2 %, autres actions \u22123 %.
timemachine.compare.note=Les rejouages utilisent exactement le m\u00eame chemin de march\u00e9. Ce sont des exercices contrefactuels avec r\u00e9trospection : ils ne modifient jamais votre profil de comp\u00e9tences.
profile.calibration.note=R\u00e9trospectif et hors score. Chaque ordre not\u00e9 est compar\u00e9 au march\u00e9 \u00e0 poids \u00e9gaux de la mission depuis l'ex\u00e9cution jusqu'\u00e0 la fin. En dessous de {0} ordres, le signal est surtout du bruit ; un r\u00e9sultat d\u00e9favorable seul n'est pas une preuve de surconfiance.
