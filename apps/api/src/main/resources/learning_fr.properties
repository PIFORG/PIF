mission.interest-rate-shock.event.rate-hike.body=La d\u00e9cision surprend les march\u00e9s. Les banques peuvent gagner plus sur les pr\u00eats ; obligations et services aux collectivit\u00e9s sont r\u00e9\u00e9valu\u00e9s \u00e0 la baisse.
mission.liquidity-crisis.briefing.rule.0=\u00c0 partir du jour 10, Sfax Phosphates (et toute autre position) doit \u00eatre \u00e0 20 % ou moins des fonds propres.
mission.liquidity-crisis.briefing.rule.1=Gardez le drawdown maximal \u00e0 12 % ou moins.
mission.liquidity-crisis.briefing.tip.0=Les ordres au march\u00e9 ne s'ex\u00e9cutent que contre ce qui est au carnet ; le reste est annul\u00e9.
mission.liquidity-crisis.briefing.tip.1=Co\u00fbt d'ex\u00e9cution = commissions + moiti\u00e9 du spread sur chaque unit\u00e9.
mission.liquidity-crisis.outcome.0=Voir comment une liquidit\u00e9 mince provoque des ex\u00e9cutions partielles et des spreads larges.
mission.liquidity-crisis.outcome.1=\u00c9taler un gros ordre dans le temps et utiliser des limites pour ma\u00eetriser le co\u00fbt d'ex\u00e9cution.
mission.liquidity-crisis.objective.reduce=Chaque position \u00e0 20 % ou moins \u00e0 partir du jour 10
mission.liquidity-crisis.objective.drawdown=Gardez le drawdown maximal \u00e0 12 % ou moins
mission.liquidity-crisis.event.liquidity.headline=Rumeurs d'interdiction d'export figent le trading des phosphates
mission.liquidity-crisis.event.liquidity.body=Les acheteurs reculent. Les teneurs de march\u00e9 \u00e9largissent fortement les cotations et affichent tr\u00e8s peu de taille.
mission.overconfident-trader.briefing.rule.0=Notez votre confiance de 0 \u00e0 100 sur chaque ordre. Ce n'est pas scor\u00e9 ; \u00e0 la fin cela est compar\u00e9 au r\u00e9sultat de chaque ordre.
mission.overconfident-trader.briefing.rule.1=Pas plus de 6 ordres ex\u00e9cut\u00e9s.
mission.overconfident-trader.briefing.rule.2=Restez investi en moyenne \u00e0 au moins 50 %.
mission.overconfident-trader.briefing.rule.3=Gardez le drawdown maximal \u00e0 10 % ou moins.
mission.overconfident-trader.briefing.tip.0=Une confiance \u00e9lev\u00e9e doit rester rare et m\u00e9rit\u00e9e.
mission.overconfident-trader.briefing.tip.1=Une rumeur n'est pas un fait : demandez-vous ce que vous feriez si elle \u00e9tait d\u00e9mentie demain.
mission.overconfident-trader.outcome.0=Mesurer le calibrage de la confiance.
mission.overconfident-trader.outcome.1=Reconna\u00eetre le surtrading li\u00e9 \u00e0 la surconfiance.
mission.overconfident-trader.objective.trades=Pas plus de 6 ordres ex\u00e9cut\u00e9s
mission.overconfident-trader.objective.invested=Restez investi en moyenne \u00e0 au moins 50 %
mission.overconfident-trader.objective.drawdown=Gardez le drawdown maximal \u00e0 10 % ou moins
mission.overconfident-trader.event.false-rally.headline=Rumeur : TunisTech en discussions de rachat
mission.overconfident-trader.event.false-rally.body=Une source anonyme affirme qu'un groupe \u00e9tranger s'int\u00e9resse. La soci\u00e9t\u00e9 refuse de commenter.
mission.overconfident-trader.event.denial.headline=TunisTech d\u00e9ment les discussions de rachat
mission.overconfident-trader.event.denial.body=La soci\u00e9t\u00e9 indique n'avoir re\u00e7u aucune offre.
mission.survive-the-market-crash.briefing.rule.0=La mission \u00e9choue imm\u00e9diatement si les fonds propres baissent de 10 % sous 100 000 DT.
mission.survive-the-market-crash.briefing.rule.1=D\u00e8s le jour 1, gardez chaque position \u00e0 35 % ou moins des fonds propres en fin de journ\u00e9e.
mission.survive-the-market-crash.briefing.rule.2=D\u00e9tenez au moins trois actifs et restez investi en moyenne \u00e0 au moins 50 %.
mission.survive-the-market-crash.briefing.rule.3=Lancez un stress test avant le jour 8.
mission.survive-the-market-crash.briefing.tip.0=Commencez par le probl\u00e8me de concentration.
mission.survive-the-market-crash.briefing.tip.1=Un stress test indique si vous survivriez \u00e0 une baisse de 20 % aujourd'hui.
mission.survive-the-market-crash.briefing.tip.2=Les spreads s'\u00e9largissent et la liquidit\u00e9 s'amenuise pendant le krach.
mission.survive-the-market-crash.outcome.0=R\u00e9duire la concentration avant une crise plut\u00f4t que pendant.
mission.survive-the-market-crash.outcome.1=Utiliser un stress test pour dimensionner le risque par rapport \u00e0 une limite de perte.
mission.survive-the-market-crash.outcome.2=Combiner diversification, liquidit\u00e9s et stops en une d\u00e9fense coh\u00e9rente.
mission.survive-the-market-crash.outcome.3=Comparer votre trajectoire \u00e0 des alternatives dans la Time Machine sans biais de r\u00e9trospection.
mission.survive-the-market-crash.objective.max-loss=Ne perdez jamais 10 % ou plus
mission.survive-the-market-crash.objective.weight-cap=Gardez chaque position \u00e0 35 % ou moins d\u00e8s le jour 1
mission.survive-the-market-crash.objective.three-assets=D\u00e9tenez au moins trois actifs
mission.survive-the-market-crash.objective.invested=Restez investi en moyenne \u00e0 au moins 50 %
