mission.my-first-trade.title=Mon premier ordre
mission.my-first-trade.summary=Lisez une cotation, choisissez un type d'ordre et achetez vos premi\u00e8res actions avec une raison que vous pouvez expliquer.
mission.my-first-trade.briefing.context=Vous disposez de 10 000 DT et de deux actions. L'objectif n'est pas de s'enrichir en cinq jours \u2014 c'est de passer un premier ordre motiv\u00e9 et de comprendre exactement ce qu'il vous a co\u00fbt\u00e9.
mission.protect-your-capital.title=Prot\u00e9gez votre capital
mission.protect-your-capital.summary=Vous d\u00e9tenez d\u00e9j\u00e0 une action technologique volatile. Mettez une protection en place avant la mauvaise nouvelle.
mission.protect-your-capital.briefing.context=Votre portefeuille de 20 000 DT d\u00e9tient 500 actions TunisTech achet\u00e9es au cours du jour, plus des liquidit\u00e9s. Le titre bouge beaucoup. D\u00e9cidez ce que vous acceptez de perdre et prot\u00e9gez-le.
mission.diversification-challenge.title=Le d\u00e9fi de la diversification
mission.diversification-challenge.summary=Construisez un portefeuille d'au moins quatre actifs o\u00f9 aucune position ne domine.
mission.diversification-challenge.briefing.context=Vous partez avec 50 000 DT en liquidit\u00e9s et six actifs de secteurs diff\u00e9rents. Constituez un portefeuille capable d'absorber une surprise sur une seule soci\u00e9t\u00e9.
mission.breaking-news.title=Actualit\u00e9 urgente
strategy.hold=Conserver sans trader
strategy.manual=Reprendre la main
mission.breaking-news.summary=Deux titres, deux histoires tr\u00e8s diff\u00e9rentes. D\u00e9cidez quelle actualit\u00e9 compte pour votre portefeuille.
mission.breaking-news.briefing.context=Vous g\u00e9rez 30 000 DT r\u00e9partis entre une banque, un op\u00e9rateur t\u00e9l\u00e9com et des liquidit\u00e9s. Des titres d'actualit\u00e9 arriveront pendant la semaine.
mission.market-shock.title=Le choc de march\u00e9
mission.market-shock.summary=Une baisse soudaine du march\u00e9 teste si vous vous y \u00e9tiez pr\u00e9par\u00e9 \u2014 ou si vous paniquez.
mission.market-shock.briefing.context=Vous g\u00e9rez un portefeuille diversifi\u00e9 de 50 000 DT. Les march\u00e9s ont \u00e9t\u00e9 calmes \u2014 peut-\u00eatre trop calmes.
mission.sector-collapse.title=L'effondrement sectoriel
mission.sector-collapse.summary=Votre portefeuille est tr\u00e8s expos\u00e9 aux banques juste au moment o\u00f9 le secteur bancaire se fissure.
mission.sector-collapse.briefing.context=Vous h\u00e9ritez d'un portefeuille de 40 000 DT dont la majeure partie est en Carthage Bank. Des rumeurs de cr\u00e9ances douteuses circulent.
mission.interest-rate-shock.title=Le choc de taux
mission.interest-rate-shock.summary=La banque centrale surprend avec une forte hausse de taux. Obligations et services aux collectivit\u00e9s se r\u00e9\u00e9valuent.
mission.interest-rate-shock.briefing.context=Un portefeuille de revenus de 40 000 DT (obligations et services aux collectivit\u00e9s) fait face \u00e0 une d\u00e9cision de politique mon\u00e9taire inattendue.
mission.liquidity-crisis.title=La crise de liquidit\u00e9
mission.liquidity-crisis.summary=Vous devez r\u00e9duire une grosse position juste quand les acheteurs disparaissent et que les spreads explosent.
mission.liquidity-crisis.briefing.context=La moiti\u00e9 de votre portefeuille de 60 000 DT est en Sfax Phosphates. Le comit\u00e9 des risques exige moins de 20 % d'ici la fin du jour 10. La liquidit\u00e9 va se tarir.
mission.overconfident-trader.title=Le trader trop confiant
mission.overconfident-trader.summary=Chaque ordre demande votre niveau de confiance. \u00c0 la fin, celle-ci est compar\u00e9e \u00e0 vos r\u00e9sultats.
mission.overconfident-trader.briefing.context=Une s\u00e9rie de gains vous a donn\u00e9 un sentiment d'invincibilit\u00e9. Cette mission suit votre confiance \u00e0 chaque d\u00e9cision.
mission.survive-the-market-crash.title=Survivre au krach
mission.survive-the-market-crash.summary=Un portefeuille concentr\u00e9 de 100 000 DT, des signaux d'alerte, puis un krach. Ne perdez pas plus de 10 %.
mission.survive-the-market-crash.briefing.context=Vous reprenez un portefeuille de 100 000 DT avec 41 % en TunisTech. La r\u00e8gle du comit\u00e9 est simple : ne jamais perdre plus de 10 %. Sur 20 s\u00e9ances, des signaux pr\u00e9c\u00e9deront le krach.
story.sarah-and-the-market-crash.title=Sarah et le krach boursier
story.sarah-and-the-market-crash.summary=Sarah a investi 10 000 DT. Le march\u00e9 baisse de 15 % en une semaine. Vendre pour stopper l'h\u00e9morragie, ou conserver et attendre ?
story.adam-first-order.title=Le premier ordre d'Adam
story.adam-first-order.summary=Adam veut 100 actions Olivia Foods. Ordre au march\u00e9 ou ordre \u00e0 cours limit\u00e9 ?
story.youssef-all-in.title=Youssef mise tout
story.youssef-all-in.summary=Un tuyau, 20 000 DT et une seule action. Que se passe-t-il quand la soci\u00e9t\u00e9 tr\u00e9buche ?
story.youssef-and-the-gap.title=Youssef et le gap
story.youssef-and-the-gap.summary=Youssef d\u00e9tient 500 TunisTech avant les r\u00e9sultats. Placer un stop \u00e0 26 DT, ou faire confiance au titre ?
story.scene.sarah-and-the-market-crash.s1=Voici Sarah. Elle a investi {0} dinars dans un fonds actions diversifi\u00e9, en \u00e9pargnant pour un appartement dans cinq ans.
story.scene.sarah-and-the-market-crash.s2=Puis le march\u00e9 baisse de 15 % en une semaine. Ses {0} dinars ne valent plus que {1}.
story.scene.sarah-and-the-market-crash.s3=A : vendre maintenant pour stopper l'h\u00e9morragie. B : conserver et attendre un rebond. Que feriez-VOUS ? A ou B ? Choisissez mentalement.
story.scene.sarah-and-the-market-crash.s4=Si vous avez choisi A : Sarah vend. Apr\u00e8s 0,5 % de frais, elle conserve {0} dinars en liquidit\u00e9s. Le mois suivant, le fonds baisse encore de 12 %, sans l'atteindre.
story.scene.sarah-and-the-market-crash.s5=Mais six mois plus tard, le fonds a rebondi \u00e0 {0} dinars pour le m\u00eame investissement, tandis que ses liquidit\u00e9s restent \u00e0 {1} dinars. Elle a limit\u00e9 les d\u00e9g\u00e2ts\u2026 et manqu\u00e9 le rebond.
story.scene.sarah-and-the-market-crash.s6=Revenons en arri\u00e8re \u2014 au jour de la d\u00e9cision.
story.scene.sarah-and-the-market-crash.s7=Si vous avez choisi B : Sarah conserve. D'abord le fonds baisse encore de 12 % : son \u00e9pargne touche {0} dinars, soit {1} % sous son point de d\u00e9part. Conserver fait mal.
story.scene.sarah-and-the-market-crash.s8=Six mois plus tard, il revient \u00e0 {0} dinars. Conserver a pay\u00e9 ici \u2014 parce qu'elle pouvait attendre. Si elle avait eu besoin de l'argent au creux, vendre lui aurait laiss\u00e9 {1} dinars de plus.
story.scene.sarah-and-the-market-crash.s9=Une d\u00e9cision ne se juge pas seulement \u00e0 son profit. Tol\u00e9rance au risque, horizon, information disponible et objectif comptent tous.
story.scene.adam-first-order.a1=Adam ouvre son premier compte avec 1 000 dinars. Il veut 100 actions Olivia Foods.
story.scene.adam-first-order.a2=La cotation affiche un prix acheteur de 9,820 et un prix vendeur de 9,880. A : acheter maintenant au march\u00e9. B : poser une limite \u00e0 9,850. Que feriez-VOUS ? A ou B ? Choisissez mentalement.
story.scene.adam-first-order.a3=S'il envoie un ordre au march\u00e9, il ach\u00e8te imm\u00e9diatement au prix vendeur. Avec 0,25 % de commission, il paie {0} dinars.
story.scene.adam-first-order.a4=Revenons en arri\u00e8re.
story.scene.adam-first-order.a5=S'il pose une limite \u00e0 9,850, il attend. Le cours baisse le lendemain et son ordre s'ex\u00e9cute : {0} dinars. Moins cher \u2014 mais un autre jour, il n'aurait peut-\u00eatre jamais \u00e9t\u00e9 servi.
story.scene.adam-first-order.a6=Un ordre au march\u00e9 ach\u00e8te la certitude d'ex\u00e9cution. Un ordre \u00e0 cours limit\u00e9 ach\u00e8te la certitude de prix. Sachez de laquelle vous avez besoin.
story.scene.youssef-all-in.y1=Youssef entend d'un ami que TunisTech va d\u00e9coller. Il a 20 000 dinars.
story.scene.youssef-all-in.y2=A : tout mettre dans TunisTech. B : r\u00e9partir sur cinq secteurs. Que feriez-VOUS ? A ou B ? Choisissez mentalement.
story.scene.youssef-all-in.y3=S'il mise tout : une panne de centre de donn\u00e9es frappe TunisTech (\u22127 % en une journ\u00e9e). Ses 20 000 dinars deviennent {0} dinars.
story.scene.youssef-all-in.y4=Revenons en arri\u00e8re.
story.scene.youssef-all-in.y5=S'il r\u00e9partit 20 % par secteur, la panne ne touche qu'une tranche. Les autres secteurs ne bougent pas ce jour-l\u00e0, et il termine \u00e0 {0} dinars.
story.scene.youssef-all-in.y6=Si le tuyau avait \u00e9t\u00e9 juste et que TunisTech avait gagn\u00e9 10 %, tout miser aurait rapport\u00e9 {0} dinars au lieu de {1}. La concentration amplifie les deux issues ; la diversification \u00e9change un peu de potentiel de hausse contre de la r\u00e9silience.
story.scene.youssef-and-the-gap.g1=Youssef d\u00e9tient 500 TunisTech \u00e0 27,40 \u2014 13 700 dinars. La soci\u00e9t\u00e9 publie demain matin.
story.scene.youssef-and-the-gap.g2=A : pas de stop \u2014 il fait confiance au titre. B : un stop protecteur \u00e0 26,00. Que feriez-VOUS ? A ou B ? Choisissez mentalement.
story.scene.youssef-and-the-gap.g3=Si vous avez choisi A : TunisTech publie un avertissement sur r\u00e9sultats et ouvre \u00e0 24,90. Youssef esp\u00e8re un rebond ; le titre glisse \u00e0 23,50 en trois jours. Sa position vaut {0} dinars. Avec de bons r\u00e9sultats, il aurait gard\u00e9 toutes ses actions.
story.scene.youssef-and-the-gap.g4=Revenons en arri\u00e8re.
story.scene.youssef-and-the-gap.g5=Si vous avez choisi B : le m\u00eame avertissement frappe. Le stop vend \u00e0 l'ouverture \u2014 \u00e0 24,90, pas 26,00, car le cours a ouvert en gap sous son seuil. Il conserve {0} dinars, mais si le titre avait rebondi, il n'en profiterait plus.
story.scene.youssef-and-the-gap.g6=Un stop limite la dur\u00e9e de l'erreur, pas le prix exact de sortie. Les gaps existent \u2014 dimensionnez en cons\u00e9quence.

