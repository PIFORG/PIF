spring.application.name=pif-api-spring
spring.main.banner-mode=off
server.port=${SPRING_API_PORT:3002}
server.error.whitelabel.enabled=false
server.forward-headers-strategy=none
spring.mvc.problemdetails.enabled=false
spring.web.resources.add-mappings=false

# Schema ownership: historical Prisma SQL lives under tools/db-harness/prisma/migrations (reference only).
# This service uses plain JDBC: no ORM, no DDL generation, no SQL init scripts.
spring.sql.init.mode=never
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=pif-spring

# Enabled or disabled by DotEnvEnvironmentPostProcessor from SWAGGER_ENABLED / NODE_ENV, as in NestJS.
springdoc.api-docs.path=/api/docs-json
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.path=/api/docs

logging.level.root=INFO

spring.messages.basename=messages
spring.messages.encoding=UTF-8
